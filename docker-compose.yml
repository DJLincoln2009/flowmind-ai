services:
  api:
    build:
      context: ./apps/api
    container_name: flowmind-api
    environment:
      FLOWMIND_DATABASE_URL: ${FLOWMIND_DATABASE_URL:-sqlite+aiosqlite:////data/flowmind.db}
      FLOWMIND_JWT_SECRET: ${FLOWMIND_JWT_SECRET:-dev-secret-a-remplacer-en-production-32-bytes-min}
      FLOWMIND_CORS_ORIGINS: ${FLOWMIND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: flowmind-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  api-data: